name: Portal production

# Deploys the portal to its production Worker (detcord-portal at
# portal.detcorddigital.com) when portal changes land on main.
# Separate from the marketing site's Worker, which Cloudflare builds itself.

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - '.github/workflows/portal-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx vite build
      - run: npx vitest run
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply detcord-portal --remote
      - name: Deploy production Worker
        run: npm run deploy
