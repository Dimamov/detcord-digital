name: Ping IndexNow

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Cloudflare deploy to go live
        run: sleep 120
      - name: Submit sitemap URLs to IndexNow (Bing, Yandex, Seznam, Naver)
        run: |
          KEY=67da8a9fb60b41b9d399d5693e7c276a
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's#</\?loc>##g' | jq -R . | jq -sc .)
          jq -n --arg key "$KEY" --argjson urls "$URLS" \
            '{host:"www.detcorddigital.com",key:$key,keyLocation:("https://www.detcorddigital.com/"+$key+".txt"),urlList:$urls}' > payload.json
          curl -sS -o response.txt -w '%{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @payload.json | tee status.txt
          cat response.txt
          grep -qE '^20[02]$' status.txt
