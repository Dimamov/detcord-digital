name: Portal staging

# Tests the portal on every change, and deploys it to the separate staging
# Worker (detcord-portal-staging on workers.dev). Never touches the live site,
# its domains or DNS.

on:
  push:
    branches: [portal-v2]
    paths:
      - 'portal/**'
      - '.github/workflows/portal-staging.yml'
  pull_request:
    paths:
      - 'portal/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-staging
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx vite build
      - run: npx vitest run

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until Cloudflare secrets exist
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping staging deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci --legacy-peer-deps
      - name: Apply database migrations
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply detcord-portal-staging --remote --env staging
      - name: Deploy staging Worker
        if: steps.gate.outputs.ready == 'true'
        run: npm run deploy:staging
